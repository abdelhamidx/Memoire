version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: velib_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  # api:
  #   build: ./api
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - db

volumes:
  pgdata:
